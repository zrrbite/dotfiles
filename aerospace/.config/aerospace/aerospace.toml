# AeroSpace tiling window manager for macOS
# Keybinds mirror GlazeWM (Windows) and Hyprland (Linux) from this dotfiles repo.
# Docs: https://nikitabobko.github.io/AeroSpace/guide

start-at-login = true
after-login-command = []
after-startup-command = [
    'exec-and-forget sketchybar',
    # 5pt rounded rather than 8pt square: thinner than the 12pt gaps so it
    # outlines a window instead of framing it. hidpi draws at retina
    # resolution, so the rounded corners aren't jagged.
    'exec-and-forget borders active_color=0xff88c0d0 inactive_color=0xff4c566a width=5.0 style=round hidpi=on'
]

# Focus-follows-mouse comes from AutoRaise, which AeroSpace cannot do itself.
# It runs as a launchd service rather than from after-startup-command, so it
# survives restarting AeroSpace and starts at login independently:
#   brew services start dimentium/autoraise/autoraise
# Do not also launch it above -- that would leave two instances running.

exec-on-workspace-change = ['/bin/bash', '-c',
    'sketchybar --trigger aerospace_workspace_change FOCUSED_WORKSPACE=$AEROSPACE_FOCUSED_WORKSPACE'
]

# Mouse follows focus: warp the cursor to a window when focus moves to it.
# This is the opposite direction from focus-follows-mouse, and it is what makes
# AutoRaise usable -- without it, focusing a window by keyboard would leave the
# cursor over the previous window and AutoRaise would immediately take focus
# back. Focus-follows-mouse itself comes from AutoRaise, started above.
on-focus-changed = ['move-mouse window-lazy-center']

# Normalizations
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

# Mouse handling
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

# Layout algorithm: 'tiles' (i3-style) or 'accordion'
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

# Gaps (matches GlazeWM 12px)
[gaps]
inner.horizontal = 20
inner.vertical = 20
outer.left = 12
outer.bottom = 12
outer.top = 44
outer.right = 12

# Main mode keybindings
[mode.main.binding]
# Focus movement (vim-style)
alt-h = 'focus left'
alt-j = 'focus down'
alt-k = 'focus up'
alt-l = 'focus right'

# Cycle windows within the workspace, alt-tab style. The hjkl bindings above
# are directional; these walk every window in tree order instead.
alt-tab = 'focus dfs-next'
alt-shift-tab = 'focus dfs-prev'

# Move focused window
alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'

# Resize. 'smart' resizes along the parent container's own orientation and
# 'smart-opposite' across it, so these keep working after alt-v flips a
# container to vertical -- an explicit 'width' in a v_tiles container silently
# does nothing, which reads as "resize is broken for this window".
alt-u = 'resize smart -50'
alt-p = 'resize smart +50'
alt-o = 'resize smart-opposite +50'
alt-i = 'resize smart-opposite -50'

# Undo a squeezed layout. AeroSpace sizes tiles without knowing an app's
# minimum window size: it assigns the tile, the app refuses to shrink below
# its floor, and the oversized window then overlaps its neighbour or hangs off
# the screen edge -- AeroSpace does not re-flow the others to compensate.
# Measured floors on this setup: Slack 668px wide, Discord 800px. Squeeze a
# 3440px workspace so either falls under that and the row visibly breaks.
# Equal thirds (~1125px) are safely above both, so balancing always recovers.
alt-b = 'balance-sizes'

# Enter resize mode (HJKL to resize, b to balance, escape to exit)
alt-r = 'mode resize'

# Toggle tiling direction (matches alt+v in GlazeWM)
alt-v = 'layout tiles horizontal vertical'

# Toggle floating (matches alt+shift+space in GlazeWM)
alt-shift-space = 'layout floating tiling'

# Toggle fullscreen (matches alt+f in GlazeWM)
alt-f = 'fullscreen'

# Close focused window (matches alt+shift+q in GlazeWM)
alt-shift-q = 'close'

# Launch the terminal (matches alt+enter in GlazeWM → terminal). Ghostty is
# the default; `open -na` is what its own help recommends on macOS, since its
# `+new-window` action is Linux-only. Alacritty stays one modifier away while
# the two are compared.
alt-enter = 'exec-and-forget open -na Ghostty'
alt-shift-enter = 'exec-and-forget open -na Alacritty'

# Reload config (matches alt+shift+r in GlazeWM)
alt-shift-r = 'reload-config'

# Focus workspace (matches alt+N in GlazeWM/Hyprland)
alt-1 = 'workspace 1'
alt-2 = 'workspace 2'
alt-3 = 'workspace 3'
alt-4 = 'workspace 4'
alt-5 = 'workspace 5'
alt-6 = 'workspace 6'
alt-7 = 'workspace 7'
alt-8 = 'workspace 8'
alt-9 = 'workspace 9'

# Move window to workspace and follow (matches alt+shift+N in GlazeWM)
alt-shift-1 = ['move-node-to-workspace 1', 'workspace 1']
alt-shift-2 = ['move-node-to-workspace 2', 'workspace 2']
alt-shift-3 = ['move-node-to-workspace 3', 'workspace 3']
alt-shift-4 = ['move-node-to-workspace 4', 'workspace 4']
alt-shift-5 = ['move-node-to-workspace 5', 'workspace 5']
alt-shift-6 = ['move-node-to-workspace 6', 'workspace 6']
alt-shift-7 = ['move-node-to-workspace 7', 'workspace 7']
alt-shift-8 = ['move-node-to-workspace 8', 'workspace 8']
alt-shift-9 = ['move-node-to-workspace 9', 'workspace 9']

# Cycle through active workspaces (matches alt+s/alt+a in GlazeWM)
alt-s = 'workspace next'
alt-a = 'workspace prev'
alt-d = 'workspace-back-and-forth'

# Move workspace to monitor (matches alt+shift+a/f in GlazeWM)
alt-shift-a = 'move-workspace-to-monitor prev'
alt-shift-f = 'move-workspace-to-monitor next'

# Resize mode (matches GlazeWM resize binding mode)
[mode.resize.binding]
h = 'resize smart -50'
j = 'resize smart-opposite +50'
k = 'resize smart-opposite -50'
l = 'resize smart +50'
b = 'balance-sizes'
esc = 'mode main'
enter = 'mode main'
