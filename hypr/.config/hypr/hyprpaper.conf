# hyprpaper 0.8+ syntax: one `wallpaper { }` block per monitor. An empty
# `monitor` makes it the fallback for every display. The old `preload =` and
# `wallpaper = ,path` lines make hyprpaper 0.8.1+ refuse to start (syntax from
# archinstall doc/arch-hyprland-guide.md, Part 8). `~` rather than a
# hardcoded /home/<user>, so it works under any username.
wallpaper {
    monitor =
    path = ~/.local/share/wallpapers/arch-blue-lowlight.png
    fit_mode = cover
}

splash = false
