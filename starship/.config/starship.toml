"$schema" = 'https://starship.rs/config-schema.json'

# Layout: the directory and git as two rounded Nord pills, then the
# language/tool modules starship detects in the current directory, the last
# command's duration when it was slow, and the prompt character on its own
# line. The per-module tables below keep the Nerd Font symbol preset; only the
# modules named here change their look. Colours follow the Nord contract in
# doc/status-bar-theming.md: nord10 indigo for "where", nord8 cyan for git.
#
# The git pill is two modules: git_branch opens it and git_status closes it,
# so the status markers sit inside. git_status always renders in a repo
# (its markers are optional), so the pill is always closed.
format = """
$directory\
$git_branch\
$git_status\
$git_state\
$all\
$cmd_duration\
$line_break\
$character"""

palette = "nord"

[palettes.nord]
nord0 = "#2E3440"
nord1 = "#3B4252"
nord2 = "#434C5E"
nord3 = "#4C566A"
nord4 = "#D8DEE9"
nord6 = "#ECEFF4"
nord7 = "#8FBCBB"
nord8 = "#88C0D0"
nord9 = "#81A1C1"
nord10 = "#5E81AC"
nord11 = "#BF616A"
nord12 = "#D08770"
nord13 = "#EBCB8B"
nord14 = "#A3BE8C"
nord15 = "#B48EAD"

[character]
success_symbol = "[❯](bold nord8)"
error_symbol = "[❯](bold nord11)"
vimcmd_symbol = "[❮](bold nord14)"

[cmd_duration]
min_time = 2_000
format = "[ $duration]($style) "
style = "nord13"

[git_status]
format = "([$all_status$ahead_behind ](fg:nord13 bg:nord1))[](nord1) "

[git_state]
format = "[ $state( $progress_current/$progress_total)]($style) "
style = "bold nord12"

[aws]
symbol = " "

[buf]
symbol = " "

