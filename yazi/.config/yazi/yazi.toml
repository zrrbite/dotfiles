# yazi -- terminal file manager, the Finder replacement. Written against yazi
# 26.9; keys are checked against that release's preset (yazi-config/preset/
# yazi-default.toml), because they were renamed between versions ([manager] ->
# [mgr]). Only the differences from the defaults are set here.
#
# No theme.toml on purpose: the default theme uses the terminal's 16 named
# colours, and Ghostty and Alacritty already map those to Nord. So yazi is
# Nord-themed for free, and follows the terminal if its palette changes.
#
# Image previews need a terminal with a graphics protocol: Ghostty yes,
# Alacritty no (blocky fallback). Inside tmux they also need
# `allow-passthrough on`, set in tmux/.tmux.conf.
#
# Launch with `y` (zsh/.zshrc), not `yazi`: `y` leaves the shell in the
# directory you quit in.

[mgr]
ratio          = [ 1, 3, 4 ]   # parent | current | preview -- a wider preview than the default 1:4:3
sort_by        = "natural"     # file2 before file10
sort_dir_first = true
linemode       = "size"        # show sizes beside names
show_hidden    = true          # dotfiles visible by default, as in Finder; `.` hides them

[preview]
max_width     = 1200           # Retina: the 600x900 default looks soft
max_height    = 1800
image_quality = 90

# -- Plugins ------------------------------------------------------------------
# Declared in package.toml, pinned to a revision. `ya pkg install` fetches
# them; the installers run it. Setup syntax is from each plugin's README at
# that revision.

# git.yazi: git status in the file list (setup in init.lua).
[[plugin.prepend_fetchers]]
url   = "*"
run   = "git"
group = "git"

[[plugin.prepend_fetchers]]
url   = "*/"
run   = "git"
group = "git"

# piper.yazi + glow: render Markdown in the preview pane instead of showing
# raw text. -w=$w wraps to the pane's width.
[[plugin.prepend_previewers]]
url = "*.md"
run = 'piper -- CLICOLOR_FORCE=1 glow -w=$w -s=dark "$1"'
