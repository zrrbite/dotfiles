# Alacritty Configuration
# Nord Theme

[window]
padding = { x = 10, y = 10 }
# Buttonless: no title bar or traffic lights, which only waste space under a
# tiling WM, but macOS keeps the rounded corners. Linux ignores it ("None"
# there would drop the server-side frame too).
decorations = "Buttonless"
opacity = 0.95
startup_mode = "Windowed"

[font]
normal = { family = "JetBrainsMono Nerd Font", style = "Regular" }
bold = { family = "JetBrainsMono Nerd Font", style = "Bold" }
italic = { family = "JetBrainsMono Nerd Font", style = "Italic" }
bold_italic = { family = "JetBrainsMono Nerd Font", style = "Bold Italic" }
size = 15.0

[cursor]
style = "Block"
unfocused_hollow = true

[selection]
save_to_clipboard = true

# Nord Color Scheme
[colors.primary]
background = "#2E3440"
foreground = "#D8DEE9"
dim_foreground = "#A5ABB6"

[colors.cursor]
text = "#2E3440"
cursor = "#D8DEE9"

[colors.vi_mode_cursor]
text = "#2E3440"
cursor = "#D8DEE9"

[colors.selection]
text = "CellForeground"
background = "#4C566A"

[colors.search.matches]
foreground = "#2E3440"
background = "#88C0D0"

[colors.search.focused_match]
foreground = "#2E3440"
background = "#A3BE8C"

[colors.normal]
black = "#3B4252"
red = "#BF616A"
green = "#A3BE8C"
yellow = "#EBCB8B"
blue = "#81A1C1"
magenta = "#B48EAD"
cyan = "#88C0D0"
white = "#E5E9F0"

[colors.bright]
black = "#4C566A"
red = "#BF616A"
green = "#A3BE8C"
yellow = "#EBCB8B"
blue = "#81A1C1"
magenta = "#B48EAD"
cyan = "#8FBCBB"
white = "#ECEFF4"

[colors.dim]
black = "#373E4D"
red = "#94545D"
green = "#809575"
yellow = "#B29E75"
blue = "#68809A"
magenta = "#8C738C"
cyan = "#6D96A5"
white = "#AEB3BB"

[keyboard]
bindings = [
    # Common shortcuts
    { key = "V", mods = "Control|Shift", action = "Paste" },
    { key = "C", mods = "Control|Shift", action = "Copy" },
    { key = "Plus", mods = "Control", action = "IncreaseFontSize" },
    { key = "Minus", mods = "Control", action = "DecreaseFontSize" },
    { key = "Key0", mods = "Control", action = "ResetFontSize" },

    # macOS text editing in the shell, matching Ghostty; zsh/.zshrc binds what
    # these send. Cmd-Left/Right send Home/End (not Ctrl-A/E, which tmux takes
    # as its prefix). Only arrows and Backspace are mapped, so Option still
    # types { } [ ] | @ $ on the Danish layout.
    { key = "ArrowLeft",  mods = "Command", chars = "\u001b[H" },   # line start
    { key = "ArrowRight", mods = "Command", chars = "\u001b[F" },   # line end
    { key = "ArrowLeft",  mods = "Option",  chars = "\u001bb" },    # word back
    { key = "ArrowRight", mods = "Option",  chars = "\u001bf" },    # word forward
    { key = "Backspace",  mods = "Option",  chars = "\u001b\u007f" }, # delete word
    { key = "Backspace",  mods = "Command", chars = "\u0015" },     # delete to line start
]
