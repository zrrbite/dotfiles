#
# ~/.tmux.conf - tmux configuration
#

# ============================================================================
# General Settings
# ============================================================================

# Use Ctrl+a as prefix (easier to reach than Ctrl+b)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Enable mouse support (click to switch panes, drag to resize, scroll history)
set -g mouse on

# Start windows and panes at 1, not 0 (matches keyboard layout)
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed
set -g renumber-windows on

# Increase scrollback buffer size
set -g history-limit 50000

# Enable 256 color support
set -g default-terminal "screen-256color"
# Tell tmux the outer terminals do 24-bit colour, so it passes RGB through.
# Without these, Nord in nvim and the starship palette are squashed to the
# nearest of 256 colours inside tmux. (xterm-ghostty matches tmux's built-in
# xterm* entry, which grants clipboard and cursor features but not RGB.)
set -as terminal-features ",xterm-ghostty:RGB"
set -as terminal-features ",alacritty:RGB"

# Let programs inside tmux draw images (yazi previews, chafa). tmux swallows the
# escape sequences of image protocols unless passthrough is on. Passing TERM
# and TERM_PROGRAM through lets them detect Ghostty from inside tmux.
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# Address vim mode switching delay
set -s escape-time 0

# Focus events enabled for terminals that support them
set -g focus-events on

# Super useful when using "grouped sessions" and multi-monitor setup
setw -g aggressive-resize on

# ============================================================================
# Keybindings
# ============================================================================

# Reload config file
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# Split panes using | and - (more intuitive than % and ")
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# New windows open in current path
bind c new-window -c "#{pane_current_path}"

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Vim-style pane resizing
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Quick pane cycling
bind -r C-h select-window -t :-
bind -r C-l select-window -t :+

# Flip to the previously used session, like Cmd-Tab between apps. tmux's
# default for this is prefix L, which is taken by pane resizing above.
bind Tab switch-client -l

# prefix f: project picker in a popup -- fuzzy-find a folder in ~/Development
# and switch to its session (created if needed). It runs `tp` from
# zsh/.zshrc, so the picker has one implementation. Replaces tmux's default
# find-window on f; prefix w still finds windows.
bind f display-popup -E -w 70% -h 60% -T " project " "zsh -ic tp"

# Previous / next session: prefix, then Cmd-Left / Cmd-Right. The terminals
# send those as Home / End (they're line start/end in the shell), but after
# the prefix tmux is reading a command key, so there's no conflict. -r lets
# Cmd-Right repeat without pressing the prefix again (within repeat-time).
bind -r Home switch-client -p
bind -r End  switch-client -n

# Toggle pane zoom
bind -r z resize-pane -Z

# Kill pane without confirmation
bind x kill-pane

# Copy mode with vi keys
setw -g mode-keys vi
bind [ copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# ============================================================================
# Status Bar - Nord Theme
# ============================================================================

# Status bar colors (Nord theme)
set -g status-style bg=#2E3440,fg=#D8DEE9

# Window status colors
setw -g window-status-style fg=#88C0D0,bg=#2E3440
setw -g window-status-current-style fg=#2E3440,bg=#88C0D0,bold

# Pane border colors
set -g pane-border-style fg=#4C566A
set -g pane-active-border-style fg=#88C0D0

# Message colors
set -g message-style fg=#2E3440,bg=#88C0D0

# Status bar position
set -g status-position bottom

# Status bar format
# Left: the session name. The pill turns yellow while the prefix (Ctrl-a) is
# pending -- tmux is waiting for a command key -- and a purple COPY tag shows
# in copy mode. Both are there to make the modes visible while learning.
set -g status-left-length 40
set -g status-left "#{?client_prefix,#[bg=#EBCB8B],#[bg=#88C0D0]}#[fg=#2E3440,bold] #S #[default]#{?pane_in_mode,#[fg=#2E3440#,bg=#B48EAD#,bold] COPY #[default],} "

# Right: every session, the current one bright, so you can see what's open
# without prefix s. Then the host name, which matters in tmux on the Pi over
# SSH. No date or time: sketchybar shows those.
# tmux-continuum (end of file) appends its auto-save hook to status-right, so
# nothing may set status-right after the plugins load.
set -g status-right-length 100
set -g status-right "#{S:#{?#{==:#{session_name},#{client_session}},#[fg=#88C0D0#,bold],#[fg=#4C566A#,nobold]} #{session_name} }#[default]#[fg=#81A1C1] #h "

# Window status format
setw -g window-status-format " #I:#W "
setw -g window-status-current-format " #I:#W "

# Activity monitoring
setw -g monitor-activity on
set -g visual-activity off

# ============================================================================
# Plugins -- no plugin manager: tmux-resurrect, the one in use, is loaded
# directly at the end of this file.
# ============================================================================

# ------------------------------------------------------------ tmux-resurrect --
# Sessions die with a reboot. tmux-resurrect saves and restores them: names,
# windows, panes, working directories, scrollback, and programs like nvim.
#   prefix Ctrl-s   save everything now
#   prefix Ctrl-r   restore the last save (after a reboot)
# Saves go to ~/.local/share/tmux/resurrect, outside this repo.
#
# Installed by cloning, not through TPM: one plugin doesn't need a plugin
# manager. The installers clone it (pinned tag); by hand:
#   git clone --depth 1 --branch v4.0.0 \
#     https://github.com/tmux-plugins/tmux-resurrect ~/.tmux/plugins/tmux-resurrect
# Guarded, so a machine without it still loads this config.
set -g @resurrect-capture-pane-contents 'on'
if-shell "test -f ~/.tmux/plugins/tmux-resurrect/resurrect.tmux" \
    "run-shell ~/.tmux/plugins/tmux-resurrect/resurrect.tmux"

# ------------------------------------------------------------ tmux-continuum --
# Auto-save: saves every 15 minutes, so a reboot loses at most that. With
# @continuum-restore on, starting the tmux server again (after a reboot, or
# after kill-server) restores the last save automatically -- no
# prefix Ctrl-r needed. To start truly empty, delete the saves in
# ~/.local/share/tmux/resurrect first.
# Must load after resurrect, and after status-right is set: continuum hooks
# its timer into status-right. Cloned like resurrect (pinned tag):
#   git clone --depth 1 --branch v3.1.0 \
#     https://github.com/tmux-plugins/tmux-continuum ~/.tmux/plugins/tmux-continuum
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'
if-shell "test -f ~/.tmux/plugins/tmux-continuum/continuum.tmux" \
    "run-shell ~/.tmux/plugins/tmux-continuum/continuum.tmux"
